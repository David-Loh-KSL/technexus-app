AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TechNexus - Backend stack: ECR repo, ECS Fargate service behind an ALB.
  The pipeline updates this stack's ImageTag parameter on each deploy —
  that parameter change is what CodePipeline's CloudFormation deploy action
  promotes from Dev to UAT.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, uat, prod]

  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy (set per pipeline execution / promotion)

  ContainerPort:
    Type: Number
    Default: 3000

  DesiredCount:
    Type: Number
    Default: 1

  # The Azure OpenAI key must be created manually in Secrets Manager first
  # (never put a real key in a template or parameter file committed to Git).
  #   aws secretsmanager create-secret --name technexus/<env>/azure-openai-key \
  #     --secret-string '{"AZURE_OPENAI_API_KEY":"..."}'
  AzureOpenAiSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret holding AZURE_OPENAI_API_KEY

  AzureOpenAiEndpoint:
    Type: String
    Description: Azure OpenAI resource endpoint, e.g. https://your-resource.openai.azure.com/

  AzureOpenAiDeployment:
    Type: String
    Default: gpt-5-mini
    Description: Azure OpenAI deployment name (not necessarily the base model name)

Resources:
  # NOTE: the ECR repo itself is deliberately NOT managed here. It's created
  # idempotently by infra/buildspec-build.yml (describe-repositories ||
  # create-repository) during the Build stage, which runs before this stack
  # exists on a first-ever pipeline execution. Declaring it again as a
  # CloudFormation resource here caused an "already exists" conflict.
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub technexus-${EnvironmentName}

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub technexus-${EnvironmentName}-ecs-exec-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AzureOpenAiSecretArn
                  - Fn::ImportValue: !Sub technexus-${EnvironmentName}-DBSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub technexus-${EnvironmentName}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/technexus-${EnvironmentName}
      RetentionInDays: 14

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub technexus-${EnvironmentName}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/technexus-backend-${EnvironmentName}:${ImageTag}
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Environment:
            - Name: PORT
              Value: !Ref ContainerPort
            - Name: PGHOST
              Value:
                Fn::ImportValue: !Sub technexus-${EnvironmentName}-DBEndpoint
            - Name: PGPORT
              Value:
                Fn::ImportValue: !Sub technexus-${EnvironmentName}-DBPort
            - Name: PGDATABASE
              Value: technexus
            - Name: PGSSL
              Value: 'true'
            - Name: AZURE_OPENAI_ENDPOINT
              Value: !Ref AzureOpenAiEndpoint
            - Name: AZURE_OPENAI_DEPLOYMENT
              Value: !Ref AzureOpenAiDeployment
          Secrets:
            - Name: PGUSER
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:username::'
                  - SecretArn:
                      Fn::ImportValue: !Sub technexus-${EnvironmentName}-DBSecretArn
            - Name: PGPASSWORD
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:password::'
                  - SecretArn:
                      Fn::ImportValue: !Sub technexus-${EnvironmentName}-DBSecretArn
            - Name: AZURE_OPENAI_API_KEY
              ValueFrom: !Sub '${AzureOpenAiSecretArn}:AZURE_OPENAI_API_KEY::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub TechNexus backend service SG (${EnvironmentName})
      VpcId:
        Fn::ImportValue: !Sub technexus-${EnvironmentName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  # Allow the backend service to reach RDS on 5432
  DBIngressFromBackend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub technexus-${EnvironmentName}-DBSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ServiceSecurityGroup

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub TechNexus ALB SG (${EnvironmentName})
      VpcId:
        Fn::ImportValue: !Sub technexus-${EnvironmentName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub technexus-${EnvironmentName}-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref ALBSecurityGroup]
      Subnets:
        - Fn::ImportValue: !Sub technexus-${EnvironmentName}-PublicSubnet1
        - Fn::ImportValue: !Sub technexus-${EnvironmentName}-PublicSubnet2

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub technexus-${EnvironmentName}-tg
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub technexus-${EnvironmentName}-VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub technexus-${EnvironmentName}
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub technexus-${EnvironmentName}-PrivateSubnet1
            - Fn::ImportValue: !Sub technexus-${EnvironmentName}-PrivateSubnet2
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ApiUrl:
    Value: !Sub http://${ALB.DNSName}
    Export:
      Name: !Sub technexus-${EnvironmentName}-ApiUrl
  AlbDnsName:
    # Bare hostname (no scheme) — CloudFront's Origin DomainName needs this,
    # not the http:// prefixed ApiUrl above.
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub technexus-${EnvironmentName}-AlbDnsName
  EcrRepositoryUri:
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/technexus-backend-${EnvironmentName}
    Export:
      Name: !Sub technexus-${EnvironmentName}-EcrRepositoryUri
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
