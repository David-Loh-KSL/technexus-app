AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TechNexus - Frontend hosting stack: private S3 bucket + CloudFront with
  Origin Access Control. The pipeline syncs the Vite build output (dist/)
  into this bucket and invalidates the distribution on each deploy.
  CloudFront also proxies /api/* to the backend ALB, so the browser only
  ever talks to one HTTPS origin — the ALB itself has no TLS listener, so
  calling it directly from an HTTPS page would be blocked as mixed content.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, uat, prod]
  AlbDnsName:
    Type: String
    Description: >
      Backend ALB's bare hostname, passed in explicitly (not via
      Fn::ImportValue) so updates to the backend stack are never blocked by
      this stack's dependency on it — cross-stack exports can't be modified
      while another stack imports them, which caused real deploy failures.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub technexus-${EnvironmentName}-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub technexus-${EnvironmentName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        # SPA fallback: unknown paths (client-side routes) serve index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OAC
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: alb-origin
            # Bare ALB hostname (no scheme) — passed as a parameter, not
            # imported (see note on the AlbDnsName parameter above).
            DomainName: !Ref AlbDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              HTTPSPort: 443
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed "CachingOptimized"
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: alb-origin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # AWS managed "CachingDisabled"
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AWS managed "AllViewerExceptHostHeader"

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${SiteBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  BucketName:
    Value: !Ref SiteBucket
    Export:
      Name: !Sub technexus-${EnvironmentName}-FrontendBucket
  DistributionId:
    Value: !Ref Distribution
    Export:
      Name: !Sub technexus-${EnvironmentName}-DistributionId
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
    Export:
      Name: !Sub technexus-${EnvironmentName}-SiteUrl
