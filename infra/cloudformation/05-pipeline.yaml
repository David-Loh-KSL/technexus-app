AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TechNexus - CI/CD pipeline: GitHub source (via CodeConnections) -> CodeBuild
  (build+push image, build frontend) -> Deploy to Dev -> manual approval ->
  Deploy to UAT. Matches the workshop's Dev/UAT promotion model (Day 3 labs).
  NOTE: the CodeConnections connection must be created and authorized via the
  console/CLI first (OAuth handshake can't be scripted in CloudFormation) —
  pass its ARN as ConnectionArn.

Parameters:
  ConnectionArn:
    Type: String
    Description: ARN of an already-authorized AWS CodeConnections GitHub connection

  RepositoryId:
    Type: String
    Description: "GitHub repo in 'owner/repo' form"

  BranchName:
    Type: String
    Default: main

  AzureOpenAiSecretArnDev:
    Type: String
    Description: ARN of the Secrets Manager secret (Dev) holding AZURE_OPENAI_API_KEY
  AzureOpenAiSecretArnUat:
    Type: String
    Description: ARN of the Secrets Manager secret (UAT) holding AZURE_OPENAI_API_KEY

  AzureOpenAiEndpoint:
    Type: String
    Description: Azure OpenAI resource endpoint, shared across Dev/UAT

  AzureOpenAiDeployment:
    Type: String
    Default: gpt-5-mini

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub technexus-pipeline-artifacts-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: technexus-codebuild-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TechNexusBuildAndDeploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:aws:s3:::${ArtifactBucket}
                  - !Sub arn:aws:s3:::${ArtifactBucket}/*
                  - !Sub arn:aws:s3:::technexus-*-frontend-${AWS::AccountId}
                  - !Sub arn:aws:s3:::technexus-*-frontend-${AWS::AccountId}/*
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:CreateRepository
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: '*'
              - Effect: Allow
                # CodeBuild's own credentials are what CloudFormation uses to
                # actually create every resource in the network/database/backend/
                # frontend stacks (no separate CloudFormation service role is
                # configured), so this role needs create/manage permissions for
                # every resource type those 4 templates provision — not just
                # Describe/Read access.
                Action:
                  - ec2:*
                  - elasticloadbalancing:*
                  - rds:*
                  - ecs:*
                  - logs:*
                  - cloudfront:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:DeleteSecret
                  - secretsmanager:TagResource
                  - secretsmanager:GetRandomPassword
                Resource: '*'
              - Effect: Allow
                # Scoped to roles this app's own templates create/name — not a
                # blanket IAM grant. Covers the ECS execution/task roles created
                # by 03-backend-ecs.yaml.
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/technexus-*
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Effect: Allow
                # S3 bucket lifecycle for the frontend hosting stack (04-frontend-hosting.yaml)
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketOwnershipControls
                  - s3:PutEncryptionConfiguration
                Resource:
                  - !Sub arn:aws:s3:::technexus-*-frontend-${AWS::AccountId}

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: technexus-codepipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TechNexusPipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${ArtifactBucket}
                  - !Sub arn:aws:s3:::${ArtifactBucket}/*
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: '*'

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: technexus-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true # required to build Docker images
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra/buildspec-build.yml

  DeployDevProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: technexus-deploy-dev
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: ENVIRONMENT_NAME
            Value: dev
          - Name: AZURE_OPENAI_SECRET_ARN
            Value: !Ref AzureOpenAiSecretArnDev
          - Name: AZURE_OPENAI_ENDPOINT
            Value: !Ref AzureOpenAiEndpoint
          - Name: AZURE_OPENAI_DEPLOYMENT
            Value: !Ref AzureOpenAiDeployment
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra/buildspec-deploy.yml

  DeployUatProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: technexus-deploy-uat
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: ENVIRONMENT_NAME
            Value: uat
          - Name: AZURE_OPENAI_SECRET_ARN
            Value: !Ref AzureOpenAiSecretArnUat
          - Name: AZURE_OPENAI_ENDPOINT
            Value: !Ref AzureOpenAiEndpoint
          - Name: AZURE_OPENAI_DEPLOYMENT
            Value: !Ref AzureOpenAiDeployment
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra/buildspec-deploy.yml

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: technexus-pipeline
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: !Ref BranchName
              OutputArtifacts: [{ Name: SourceOutput }]

        - Name: Build
          Actions:
            - Name: BuildAndPush
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: BuildOutput }]

        - Name: DeployToDev
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref DeployDevProject
              InputArtifacts: [{ Name: BuildOutput }]

        - Name: ApproveForUAT
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: 'Confirm Dev deployment looks good before promoting this same build to UAT.'

        - Name: DeployToUAT
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref DeployUatProject
              InputArtifacts: [{ Name: BuildOutput }]

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
